<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA AI Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">N</div>
        <div><b>NEXA AI</b><small>Personal Assistant</small></div>
      </div>

      <button class="new-chat" onclick="newChat()">＋ नया चैट</button>

      <div class="side-label">MENU</div>
      <button class="side-item active" onclick="showChat()">◈ AI Chat</button>
      <button class="side-item" onclick="showGK()">📚 GK Practice</button>
      <button class="side-item" onclick="showVoice()">🎙 Voice Assistant</button>

      <div class="side-label">CHAT HISTORY</div>
      <div id="history" class="history"></div>

      <div class="profile">
        <div class="avatar">N</div>
        <div><b>NEXA User</b><small>Personal Account</small></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div><b>NEXA AI</b><span class="online">● Online</span></div>
        <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="hero-logo">✦</div>
          <h1>नमस्ते! मैं NEXA AI हूँ।</h1>
          <p>आज मैं आपकी क्या मदद कर सकता हूँ?</p>
          <div class="suggestions">
            <button onclick="askSuggestion('मुझे सामान्य ज्ञान के सवाल पूछो')">📚 GK Practice</button>
            <button onclick="askSuggestion('मुझे JavaScript सिखाओ')">💻 Coding Help</button>
            <button onclick="askSuggestion('आज के लिए पढ़ाई का प्लान बनाओ')">📝 Study Plan</button>
            <button onclick="askSuggestion('मुझे एक नई कहानी सुनाओ')">✨ Creative Ideas</button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
      </section>

      <section class="composer">
        <div class="input-wrap">
          <textarea id="userInput" rows="1"
            placeholder="NEXA से कुछ भी पूछिए..."
            onkeydown="handleKey(event)"></textarea>
          <div class="input-actions">
            <button title="Voice input" onclick="startVoice()">🎙</button>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
          </div>
        </div>
        <p class="disclaimer">NEXA AI गलतियाँ कर सकता है। महत्वपूर्ण जानकारी जाँच लें।</p>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
